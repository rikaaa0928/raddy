[package]
name = "raddy"
version = "0.1.10"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1.89"
env_logger = "0.11.11"
http = "1.4.2"
log = "0.4.33"
mimalloc = { version = "0.1.52", default-features = false }
pingora = { version = "0.8.1", default-features = false, features = ["proxy", "boringssl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "sync", "time", "net", "io-util", "rt"] }
url = "2.5.8"
regex = "1.12.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
boring = "4.22"
tokio-boring = "4.22"
h2 = "0.4"
bytes = "1.10"


# ACME certificate management
instant-acme = "0.8.5"
arc-swap = "1.9.2"
rcgen = { version = "0.14.8", features = ["pem"] }
x509-parser = "0.18.1"
pem = "3.0.6"
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.150"
time = "0.3.51"
